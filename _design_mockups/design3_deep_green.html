<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>baikecalc · 设计稿 3 · 深绿沉浸风</title>
<style>
  :root{
    --bg:#0C2A22;
    --bg-2:#103029;
    --card:#134038;
    --card-2:#0F362E;
    --mint:#34D8A4;
    --mint-2:#1D9E75;
    --ink:#EAF6F1;
    --ink-2:#9DBDB2;
    --line:rgba(255,255,255,.08);
    --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}

  header{background:rgba(12,42,34,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .bar{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.3px}
  .logo .dot{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--mint),var(--mint-2));display:grid;place-items:center;color:#06231B;font-weight:800;font-size:14px}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:11px 18px 11px 44px;font-size:14px;color:var(--ink);outline:none}
  .search input::placeholder{color:var(--ink-2)}
  .search input:focus{border-color:var(--mint)}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:var(--ink-2)}
  .nav{display:flex;align-items:center;gap:8px;margin-left:auto}
  .all-tools{display:flex;align-items:center;gap:7px;background:var(--mint);color:#06231B;border:none;border-radius:10px;padding:10px 15px;font-size:13.5px;font-weight:700;cursor:pointer}
  .all-tools svg{width:15px;height:15px;fill:#06231B}
  .lang,.signin{color:var(--ink-2);font-size:13px;padding:8px 6px}

  .hero{max-width:1160px;margin:0 auto;padding:64px 24px 30px;text-align:center}
  .badge{display:inline-block;background:rgba(52,216,164,.12);color:var(--mint);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:18px;border:1px solid rgba(52,216,164,.25)}
  .hero h1{font-size:42px;line-height:1.2;font-weight:800;letter-spacing:-.5px}
  .hero h1 .hl{color:var(--mint)}
  .hero p{color:var(--ink-2);font-size:16px;margin:14px auto 0;max-width:560px}
  .hero-search{max-width:560px;margin:26px auto 0;position:relative}
  .hero-search input{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:16px 22px 16px 50px;font-size:15px;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.3);outline:none}
  .hero-search input:focus{border-color:var(--mint)}
  .hero-search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-2)}
  .chip:hover{border-color:var(--mint);color:var(--mint)}

  section{max-width:1160px;margin:0 auto;padding:38px 24px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .sec-head h2{font-size:23px;font-weight:800}
  .sec-head .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
  .sec-head a{color:var(--mint);font-size:14px;font-weight:600;text-decoration:none}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;transition:.18s}
  .cat:hover{transform:translateY(-3px);border-color:var(--mint);background:var(--card-2)}
  .cat .ico{width:46px;height:46px;border-radius:13px;background:rgba(52,216,164,.14);display:grid;place-items:center;margin-bottom:13px}
  .cat .ico svg{width:23px;height:23px;fill:var(--mint)}
  .cat .name{font-weight:700;font-size:15px}
  .cat .cnt{color:var(--ink-2);font-size:12.5px;margin-top:3px}

  .pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .pop{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:13px;cursor:pointer}
  .pop:hover{border-color:var(--mint);background:var(--card-2)}
  .pop .pic{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--mint-2));display:grid;place-items:center;color:#06231B;font-size:18px;flex:none}
  .pop .t{font-weight:600;font-size:14.5px}
  .pop .d{color:var(--ink-2);font-size:12px;margin-top:2px}

  footer{border-top:1px solid var(--line);margin-top:30px;background:var(--bg-2)}
  .foot{max-width:1160px;margin:0 auto;padding:26px 24px;color:var(--ink-2);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo"><span class="dot">计</span> baikecalc</div>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
      <input placeholder="搜索计算器，如 房贷、汇率、BMI…">
    </div>
    <div class="nav">
      <button class="all-tools">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        所有工具
      </button>
      <span class="lang">中文</span>
      <span class="signin">登录</span>
    </div>
  </div>
</header>

<div class="hero">
  <span class="badge">199+ 免费在线计算器</span>
  <h1>一个网站，搞定你<span class="hl">所有计算</span>需求</h1>
  <p>单位、金融、健康、烹饪、数学……分类清晰，打开即用，无需下载。</p>
  <div class="hero-search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
    <input placeholder="想算点什么？直接搜…">
  </div>
  <div class="chips">
    <span class="chip">房贷计算器</span>
    <span class="chip">汇率换算</span>
    <span class="chip">BMI 指数</span>
    <span class="chip">卡路里</span>
    <span class="chip">百分比</span>
    <span class="chip">日期计算</span>
  </div>
</div>

<section>
  <div class="sec-head">
    <div>
      <h2>按分类浏览</h2>
      <div class="sub">19 大类别，覆盖生活与工作方方面面</div>
    </div>
    <a href="#">查看全部 →</a>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>

<section>
  <div class="sec-head">
    <div>
      <h2>🔥 热门工具</h2>
      <div class="sub">大家最近都在用的计算器</div>
    </div>
    <a href="#">更多 →</a>
  </div>
  <div class="pop-grid" id="popGrid"></div>
</section>

<footer>
  <div class="foot">
    <span>© 2026 baikecalc · 免费在线计算器</span>
    <span>隐私 · 免责声明 · 联系我们</span>
  </div>
</footer>

<script>
  const cats=[
    ["单位换算","14","M3 6h18M3 12h18M3 18h18"],
    ["金融计算","22","M12 2v20M5 9h14M5 15h14"],
    ["健康与健身","18","M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"],
    ["烹饪与食物","12","M5 3v8a3 3 0 006 0V3M19 3v8a3 3 0 01-6 0V3M8 21h8"],
    ["数学工具","16","M5 5h14v14H5zM9 9l6 6M15 9l-6 6"],
    ["时间与日期","9","M12 7v5l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"],
    ["科技与计算机","11","M4 6h16v12H4zM9 21h6M12 18v3"],
    ["建造装修","7","M3 21V8l9-5 9 5v13M9 21v-6h6v6"],
    ["教育学习","10","M3 7l9-4 9 4-9 4-9-4zM7 11v5c0 1 3 2 5 2s5-1 5-2v-5"],
    ["日常生活","13","M12 3a4 4 0 014 4c0 2-2 3-2 5h-4c0-2-2-3-2-5a4 4 0 014-4zM6 21h12"],
    ["科学计算","8","M9 3v6l-5 9a2 2 0 002 3h12a2 2 0 002-3l-5-9V3M9 3h6"],
    ["交通出行","6","M5 17h14M6 17a2 2 0 104 0M14 17a2 2 0 104 0M7 17V7h10v10"],
  ];
  document.getElementById('catGrid').innerHTML=cats.map(c=>`
    <div class="cat">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="${c[2]}"/></svg></div>
      <div class="name">${c[0]}</div>
      <div class="cnt">${c[1]} 个工具</div>
    </div>`).join('');

  const pops=[
    ["🏠","房贷计算器","月供 / 利息试算"],
    ["💱","汇率换算","实时多币种"],
    ["⚖️","BMI 指数","健康体重评估"],
    ["🔥","卡路里计算","食物热量查询"],
    ["%","百分比计算器","增减 / 占比"],
    ["📅","日期计算器","天数 / 间隔"],
    ["💡","小费计算器","聚餐分摊"],
    ["📏","长度换算","公制英制互转"],
  ];
  document.getElementById('popGrid').innerHTML=pops.map(p=>`
    <div class="pop">
      <div class="pic">${p[0]}</div>
      <div><div class="t">${p[1]}</div><div class="d">${p[2]}</div></div>
    </div>`).join('');
</script>
</body>
</html>
