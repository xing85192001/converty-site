<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>baikecalc · 设计稿 4 · tooldone 同款风格</title>
<style>
  :root{
    --hero:#0E211C;          /* 近黑墨绿，对应 tooldone 的 zinc-900 */
    --hero-2:#0A1916;
    --mint:#1D9E75;          /* 品牌薄荷绿，替换 tooldone 的琥珀金 */
    --mint-bright:#34D8A4;
    --paper:#FFFFFF;
    --paper-2:#F8FAF9;
    --ink:#0F1A17;
    --ink-2:#5B6B66;
    --line:#E8EDEB;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper-2);line-height:1.6;-webkit-font-smoothing:antialiased}

  /* 顶部导航（深色 hero 之上的透明条） */
  header{background:var(--hero);border-bottom:1px solid rgba(255,255,255,.07)}
  .bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:#fff;letter-spacing:.3px}
  .logo .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--mint-bright),var(--mint));display:grid;place-items:center;color:#06231B;font-weight:900;font-size:14px}
  .navlinks{display:none;gap:4px;overflow-x:auto;margin-left:10px}
  .navlinks a{color:rgba(255,255,255,.82);text-decoration:none;font-size:13.5px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);white-space:nowrap}
  .navlinks a:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
  .search{flex:1;max-width:420px;margin-left:auto;position:relative}
  .search input{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:999px;padding:10px 16px 10px 42px;font-size:14px;color:#fff;outline:none}
  .search input::placeholder{color:rgba(255,255,255,.5)}
  .search input:focus{border-color:var(--mint-bright)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:rgba(255,255,255,.5)}
  .lang{color:rgba(255,255,255,.7);font-size:13.5px;padding:8px 6px}

  /* 深色 hero */
  .hero{background:linear-gradient(180deg,var(--hero) 0%,var(--hero-2) 100%);color:#fff;text-align:center;padding:64px 24px 72px}
  .eyebrow{display:inline-block;background:rgba(52,216,164,.14);color:var(--mint-bright);border:1px solid rgba(52,216,164,.3);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:20px}
  .hero h1{font-size:40px;line-height:1.22;font-weight:800;letter-spacing:-.5px;max-width:760px;margin:0 auto}
  .hero p{color:rgba(255,255,255,.72);font-size:16px;max-width:600px;margin:16px auto 0}
  .hero-search{max-width:580px;margin:28px auto 0;position:relative}
  .hero-search input{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:999px;padding:16px 130px 16px 50px;font-size:15px;color:#fff;outline:none}
  .hero-search input::placeholder{color:rgba(255,255,255,.5)}
  .hero-search input:focus{border-color:var(--mint-bright)}
  .hero-search svg.pos{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:rgba(255,255,255,.5)}
  .hero-search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--mint);color:#06231B;border:none;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
  .chips span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.78);font-size:13px;padding:7px 14px;border-radius:999px}

  /* 白色内容区 */
  section{max-width:1180px;margin:0 auto;padding:52px 24px}
  .sec-head{margin-bottom:26px}
  .sec-head h2{font-size:25px;font-weight:800;letter-spacing:-.3px}
  .sec-head .sub{color:var(--ink-2);font-size:14.5px;margin-top:6px}
  .sec-head a{float:right;color:var(--mint);font-size:14px;font-weight:600;text-decoration:none;margin-top:8px}

  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .cat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:.16s}
  .cat:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-color:var(--mint)}
  .cat .top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .cat .ico{width:46px;height:46px;border-radius:13px;background:rgba(29,158,117,.12);display:grid;place-items:center;flex:none}
  .cat .ico svg{width:23px;height:23px;fill:var(--mint)}
  .cat .name{font-weight:700;font-size:16px}
  .cat .desc{color:var(--ink-2);font-size:13.5px;line-height:1.55}

  .pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px}
  .pop{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer}
  .pop:hover{border-color:var(--mint);background:var(--paper-2)}
  .pop .em{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--mint-bright),var(--mint));display:grid;place-items:center;font-size:18px;flex:none}
  .pop .t{font-weight:600;font-size:14.5px}
  .pop .d{color:var(--ink-2);font-size:12px;margin-top:1px}

  footer{border-top:1px solid var(--line);background:var(--paper)}
  .foot{max-width:1180px;margin:0 auto;padding:28px 24px;color:var(--ink-2);font-size:13.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo"><span class="mark">计</span> baikecalc</div>
    <nav class="navlinks">
      <a href="#">单位换算</a><a href="#">金融</a><a href="#">健康</a><a href="#">烹饪</a>
      <a href="#">数学</a><a href="#">时间日期</a><a href="#">科技</a><a href="#">建造</a>
    </nav>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
      <input placeholder="搜索计算器…">
    </div>
    <span class="lang">中文</span>
  </div>
</header>

<div class="hero">
  <span class="eyebrow">199+ 免费在线计算器</span>
  <h1>在线计算工具与单位转换器</h1>
  <p>baikecalc 为你提供免费、快速、准确的多语言计算工具，覆盖单位换算、金融、健康、烹饪、数学等各个领域。</p>
  <div class="hero-search">
    <svg class="pos" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
    <input placeholder="想算点什么？直接搜…">
    <button>搜索</button>
  </div>
  <div class="chips">
    <span>房贷计算器</span><span>汇率换算</span><span>BMI 指数</span><span>卡路里</span><span>百分比</span><span>日期计算</span>
  </div>
</div>

<section>
  <div class="sec-head">
    <a href="#">查看全部 →</a>
    <h2>按分类浏览</h2>
    <div class="sub">19 大类别，覆盖生活与工作的方方面面</div>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>

<section style="padding-top:8px">
  <div class="sec-head">
    <a href="#">更多 →</a>
    <h2>🔥 热门工具</h2>
    <div class="sub">大家最近都在用的计算器</div>
  </div>
  <div class="pop-grid" id="popGrid"></div>
</section>

<footer>
  <div class="foot">
    <span>© 2026 baikecalc · 免费在线计算器</span>
    <span>隐私 · 免责声明 · 联系我们</span>
  </div>
</footer>

<script>
  const cats=[
    ["单位换算","通用单位换算平台，支持公制、英制与科学测量互转。"],
    ["金融计算","贷款、投资、利率与货币相关的企业级金融计算器。"],
    ["健康与健身","BMI、卡路里、营养与日常健康监测工具。"],
    ["烹饪与食物","食材份量、营养与食谱相关的实用换算工具。"],
    ["数学工具","代数、几何与日常运算的精确数学计算器。"],
    ["时间与日期","天数、时区与日期间隔的快速计算工具。"],
    ["科技与计算机","开发、数据与进制相关的技术计算工具。"],
    ["建造装修","材料估算、面积与工程量计算工具。"],
    ["教育学习","学习与考试辅助的计算与换算工具。"],
    ["日常生活","记账、小费、分摊等日常实用计算器。"],
    ["科学计算","物理、化学与统计相关的科学计算工具。"],
    ["交通出行","油耗、里程与出行相关的计算工具。"],
  ];
  const ic='<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h4"/></svg>';
  document.getElementById('catGrid').innerHTML=cats.map(c=>`
    <div class="cat">
      <div class="top">
        <div class="ico">${ic}</div>
        <div class="name">${c[0]}</div>
      </div>
      <div class="desc">${c[1]}</div>
    </div>`).join('');

  const pops=[
    ["🏠","房贷计算器","月供 / 利息试算"],
    ["💱","汇率换算","实时多币种"],
    ["⚖️","BMI 指数","健康体重评估"],
    ["🔥","卡路里计算","食物热量查询"],
    ["%","百分比计算器","增减 / 占比"],
    ["📅","日期计算器","天数 / 间隔"],
    ["💡","小费计算器","聚餐分摊"],
    ["📏","长度换算","公制英制互转"],
  ];
  document.getElementById('popGrid').innerHTML=pops.map(p=>`
    <div class="pop">
      <div class="em">${p[0]}</div>
      <div><div class="t">${p[1]}</div><div class="d">${p[2]}</div></div>
    </div>`).join('');
</script>
</body>
</html>
